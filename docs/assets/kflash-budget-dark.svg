<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d"><title id="t">How the budget sizes trees on the 35B</title><desc id="d">Left: the budget's calibration on Qwen3.6-35B-A3B on an M4 Pro: the probability that the target accepts a node, against the drafter's probability q, fitted per position as sigmoid(alpha + beta logit q). At q = 0.7 the fit gives 0.55 at position 1, 0.52 at position 2 and 0.38 at position 4: the drafter is overconfident past the first position. Right: the share of cycles at each tree size the budget chose on Qwen3.6-35B-A3B, greedy: code: mean 6.4 rows, tokens per cycle expected 3.92, measured 3.98; prose: mean 4.8 rows, tokens per cycle expected 2.87, measured 2.72; agent r06: mean 7.1 rows, tokens per cycle expected 4.44, measured 4.39; agent r07: mean 6.8 rows, tokens per cycle expected 4.98, measured 5.00; agent r12: mean 6.3 rows, tokens per cycle expected 3.49, measured 3.27.</desc>
