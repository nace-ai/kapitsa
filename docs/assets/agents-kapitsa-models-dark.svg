<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img" aria-labelledby="t d">
<title id="t">Your coding agent, Kapitsa, and the models on your Mac</title>
<desc id="d">Three columns, left to right. Your coding agent: opencode, Claude Code, Codex, Pi, Hermes, aider and Goose. kapitsa &lt;agent&gt; starts it on the local model. An arrow labelled OpenAI and Anthropic APIs leads to Kapitsa, which decodes with KFlash and serves /v1/chat/completions, /v1/messages and /v1/responses on http://127.0.0.1:8000, with streaming, tool calls and JSON-schema output. Kapitsa runs on the GPU with hand-written Metal code, the Neural Engine, which helps read long prompts, and the SSD, where conversations stay with --disk-cache. An arrow labelled --model picks the model leads to the models on your Mac: Qwen3.6-35B-A3B (35b), Qwen3.8-27B (27b), Qwen3.8-Flash-Next 180B-A7B (flash-next), Nemotron 3.5 Lightning 30B-A3B (lightning), Recursive Flint 40B-A2.5B (flint), and more, listed under Supported models.</desc>
