<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d"><title id="t">What a verify row costs</title><desc id="d">Left: Qwen3.8-27B, dense, verify pass GPU time on an M4 Pro: a plain one-row decode step 67.3 ms, a verify of 1, 2, 4 and 8 rows 74.4, 70.6, 71.6 and 74.3 ms. Middle: Qwen3.6-35B-A3B, mixture of experts, the KFlash budget's measured cycle GPU time for 1 to 8 live rows: 14.8, 16.4, 18.0, 19.1, 19.5, 21.2, 22.3 and 23.1 ms. Right: Qwen3.8-27B with experimental 16- and 32-row tree verifies: 5.16, 5.81 and 6.01 tokens per cycle for 79.5, 137.2 and 264.3 ms per cycle, or 64.9, 42.3 and 22.7 tokens per GPU second at 8, 16 and 32 rows.</desc>
