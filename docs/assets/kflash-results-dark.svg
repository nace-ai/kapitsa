<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d"><title id="t">Tokens per cycle gained against cycle cost, per prompt</title><desc id="d">Per-prompt greedy A/B on an M4 Pro, KFlash trees against the chain of main before them. Horizontal: change in GPU time per cycle; vertical: change in tokens per cycle; on the diagonal the two cancel. Qwen 4B code: cost +6.1%, tokens +11.9%, speed +5.1%; Qwen 4B prose: cost +4.4%, tokens +13.9%, speed +9.1%; Qwen 4B r06: cost +6.4%, tokens +6.9%, speed +0.4%; Qwen 4B r07: cost +7.5%, tokens +4.5%, speed −2.7%; Qwen 4B r12: cost +5.6%, tokens +8.6%, speed +2.8%; Qwen 4B r18: cost +6.8%, tokens +5.1%, speed −1.8%; Qwen 27B code: cost +1.9%, tokens +7.9%, speed +6.0%; Qwen 27B prose: cost +1.4%, tokens +17.4%, speed +15.8%; Qwen 27B r07: cost +5.1%, tokens +2.2%, speed −2.9%; Qwen 35B code: cost +12.0%, tokens +15.5%, speed +3.2%; Qwen 35B prose: cost +6.1%, tokens +12.4%, speed +5.7%; Qwen 35B r06: cost +10.1%, tokens +9.8%, speed −0.6%; Qwen 35B r07: cost +16.0%, tokens +10.4%, speed −4.9%; Qwen 35B r12: cost +10.2%, tokens +10.1%, speed +0.0%.</desc>
