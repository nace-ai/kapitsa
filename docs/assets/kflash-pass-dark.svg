<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d"><title id="t">One pass over the tree's 8 rows</title><desc id="d">The tree of the previous figure as the verify pass sees it. Each row's token sits at position P plus its depth. Each row's attention reads the cached history and, among the 8 rows, only itself and its ancestors: row 5 (not) reads rows 0, 1 and 5. Each recurrent layer runs a row from its parent's state: row 5 from row 1's, row 6 from row 4's, row 7 from row 5's. After the pass the accepted path, rows 0, 1, 5 and 7, moves into positions P to P+3 and folds into the committed state; rows 2, 3, 4 and 6 are dropped.</desc>
