<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d"><title id="t">One cycle: a chain and a tree in the same 8 rows</title><desc id="d">The same drafter candidates verified two ways in one 8-row pass. Top, before KFlash, the drafter's chain: if, key, in, self, .cache, colon, newline, return. The target accepts key, then writes not where the chain has in, so the cycle emits 2 tokens: key, not. Bottom, KFlash's best-first tree: rows if, key, in, self, .cache, not (a second child of key), colon, and in (under not), taken in order of path probability .71, .44, .32, .26, .23, .22, .21. The target accepts key, not, in and then writes self, so the cycle emits 4 tokens: key, not, in, self.</desc>
