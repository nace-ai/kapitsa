<text x="592" y="267" font-size="17" font-weight="400" fill="#92400e">Attention KV + recurrent-state checkpoints</text>
<text x="592" y="291" font-size="17" font-weight="400" fill="#92400e">Restore a matching prefix; retain state for follow-ups</text>
