<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1210" viewBox="0 0 1120 1210" role="img" aria-labelledby="title desc">
<title id="title">Inside Kapitsa: from request to streamed tokens</title>
<desc id="desc">API adapters prepare prompts and reuse conversation checkpoints. Optional Qwen and Bolt image encoders supply cached embeddings. Pinned model weights feed Qwen or Nemotron backends. A repeating draft, target verification and commit cycle generates streamed responses. Metal runs model work; the Neural Engine optionally accelerates selected prefill operations.</desc>
