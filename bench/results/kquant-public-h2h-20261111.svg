<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">KQuant and public Q4-class pack KL comparisons</title>
<desc id="desc">Lower KL is closer to BF16. Public GGUF packs beat KQuant on both corpora for 9B and 4B. KQuant MLX beats equal-size public packs; larger mixed-bit packs have lower KL. Points show means and lines show whole-window 95 percent bootstrap intervals.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172334} .label{font-size:13px} .small{font-size:13px;fill:#475569} .heading{font-size:18px;font-weight:bold} .grid{stroke:#d6dde5;stroke-width:1}</style>
<rect width="1200" height="1100" fill="white"/>
<text x="36" y="41" font-size="28" font-weight="bold">KQuant vs public Q4-class packs</text>
<text x="36" y="73" font-size="16">Lower KL is closer to BF16. Points = means; lines = whole-window bootstrap 95% CIs.</text>
<text x="36" y="98" class="small">GGUF: public wins at our size. MLX: KQuant wins at equal LM size, not against larger mixed-bit packs.</text>
