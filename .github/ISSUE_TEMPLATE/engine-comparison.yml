name: Engine comparison
description: Another engine was faster than Kapitsa on your Mac. Paste the report of `kapitsa bench compare --report`.
title: "Compare: "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking. `kapitsa bench compare --report` measured the engines you have installed with one
        protocol (same prompts, sampler, thinking off, GPU lock) and wrote a Markdown report; paste it below.
        It holds your Mac's chip and memory, the engines' versions and the numbers: no serial number, host name,
        user name or path. Nothing was sent anywhere by the command; this issue is the only place it goes.
        Run it on a quiet Mac, plugged in, and say below if you could not.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The output of `kapitsa bench compare --report`, unchanged.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: How you installed the other engine, other apps open, a custom build, a setting we should have used.
