# A tag vX.Y.Z (X.Y.Z = KAPITSA_VERSION in CMakeLists.txt) builds the release binary with packaging/release/build.sh,
# publishes it on the GitHub release (install.sh downloads it from there), makes a Homebrew bottle of it (uploaded to the
# same release; a formula with no bottle is a source build to Homebrew, which refuses a Mac with stale or missing Command
# Line Tools) and opens a pull request with the formula in nace-ai/homebrew-tap. Optional secrets: MACOS_CERTIFICATE (base64 .p12 of a Developer ID
# Application certificate) and MACOS_CERTIFICATE_PASSWORD sign it; NOTARY_KEY (an App Store Connect API .p8 key),
# NOTARY_KEY_ID and NOTARY_ISSUER_ID also notarize it; TAP_GITHUB_TOKEN opens the formula's pull request in the tap
# (its default branch needs an approval, so the tap serves the release only after that is merged), and a stable release
# fails without it (its job summary then shows the formula to put there by hand).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGN: ${{ secrets.MACOS_CERTIFICATE != '' }}
      NOTARIZE: ${{ secrets.NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -v -i -E 'beta|rc' | sort -V | tail -1) || true
          if [ -d "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Signing keychain
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/kapitsa.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "MACOS_CERTIFICATE holds no Developer ID Application identity"; exit 1; }
          echo "KAPITSA_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "KAPITSA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ "$NOTARIZE" = true ]; then
            printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials kapitsa-notary --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
            rm "$RUNNER_TEMP/notary.p8"
            echo "KAPITSA_NOTARY_PROFILE=kapitsa-notary" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          packaging/release/build.sh "${GITHUB_REF_NAME#v}"
          ./install.sh --from-file "build/release/kapitsa-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz" --prefix "$RUNNER_TEMP/bin"
          test -x "$RUNNER_TEMP/bin/kapitsa-systemone" && test -x "$RUNNER_TEMP/bin/kapitsa-drex-pointer"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          pre=()
          case "$v" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Kapitsa $v" --generate-notes "${pre[@]}" \
            "build/release/kapitsa-$v-darwin-arm64.tar.gz" "build/release/kapitsa-$v-darwin-arm64.tar.gz.sha256"

      - name: Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -o pipefail
          v=${GITHUB_REF_NAME#v}
          sha=$(cut -d ' ' -f 1 "build/release/kapitsa-$v-darwin-arm64.tar.gz.sha256")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/kapitsa-$v-darwin-arm64.tar.gz"
          sed -E -e "s|^  url \"[^\"]*\"|  url \"$url\"|" -e "s|^  version \"[^\"]*\".*|  version \"$v\"|" \
            -e "s|^  sha256 \"[^\"]*\".*|  sha256 \"$sha\"|" packaging/homebrew/kapitsa.rb > "$RUNNER_TEMP/kapitsa.rb"
          # Make the bottle from a local tap and upload it to the release. Without one the formula is a source build to
          # Homebrew, which runs its build-environment checks and refuses a Mac with stale or missing Command Line Tools
          # ("Your Command Line Tools (CLT) does not support macOS 26"), though nothing here compiles.
          brew tap-new --no-git kapitsa-release/check
          tap_formula="$(brew --repository kapitsa-release/check)/Formula/kapitsa.rb"
          cp "$RUNNER_TEMP/kapitsa.rb" "$tap_formula"
          brew install --build-bottle kapitsa-release/check/kapitsa
          mkdir "$RUNNER_TEMP/bottle"
          (cd "$RUNNER_TEMP/bottle" && brew bottle --json --no-rebuild \
            --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" kapitsa-release/check/kapitsa)
          brew uninstall kapitsa-release/check/kapitsa
          python3 packaging/homebrew/add_bottle.py "$RUNNER_TEMP/kapitsa.rb" "$RUNNER_TEMP"/bottle/*.json "$RUNNER_TEMP/bottle-assets"
          gh release upload --clobber "$GITHUB_REF_NAME" "$RUNNER_TEMP"/bottle-assets/*.bottle.tar.gz
          # Pour it from the release as a user's brew will, and run the formula's test on that install. --force-bottle
          # fails if no bottle fits this runner, and "Pouring" shows the build-environment checks did not run.
          cp "$RUNNER_TEMP/kapitsa.rb" "$tap_formula"
          brew install --force-bottle kapitsa-release/check/kapitsa 2>&1 | tee "$RUNNER_TEMP/pour.log"
          grep -q "^==> Pouring kapitsa-$v\." "$RUNNER_TEMP/pour.log"
          brew test kapitsa-release/check/kapitsa
          brew uninstall kapitsa-release/check/kapitsa
          brew untap kapitsa-release/check
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            # A release that leaves the tap on an older version has not shipped what its notes say it shipped, and the
            # run must not be green: `brew install nace-ai/tap/kapitsa` is an install path (README, docs/usage.md), and
            # `kapitsa update` tells Homebrew users to run `brew upgrade nace-ai/tap/kapitsa`.
            { echo "No TAP_GITHUB_TOKEN secret, so nace-ai/homebrew-tap still serves the previous version. Put this in"
              echo "Formula/kapitsa.rb there by hand, as a pull request; with the secret added, later releases open it themselves:"
              echo '```ruby'; cat "$RUNNER_TEMP/kapitsa.rb"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No TAP_GITHUB_TOKEN secret: Formula/kapitsa.rb was not proposed to nace-ai/homebrew-tap, which still serves the previous version (the formula is in the job summary). Open a pull request with it there by hand; with the secret added (CONTRIBUTING.md, Releasing) the next release opens it itself."
            exit 1
          fi
          # The tap's ruleset requires a pull request with an approval for its default branch, so a direct push is
          # rejected (GH013, v0.2.25). Push a branch and open (or update) the pull request instead.
          git clone "https://x-access-token:$TAP_GITHUB_TOKEN@github.com/nace-ai/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          base=$(git symbolic-ref --short HEAD)
          mkdir -p Formula
          cp "$RUNNER_TEMP/kapitsa.rb" Formula/kapitsa.rb
          git add Formula/kapitsa.rb
          if git diff --cached --quiet; then echo "The tap already has this formula."; exit 0; fi
          branch="kapitsa-$v"
          git checkout -q -b "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "kapitsa $v"
          git push --force origin "$branch"
          export GH_TOKEN="$TAP_GITHUB_TOKEN"
          pr=$(gh pr list --repo nace-ai/homebrew-tap --head "$branch" --state open --json url -q '.[0].url')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --repo nace-ai/homebrew-tap --base "$base" --head "$branch" --title "kapitsa $v" \
              --body "Formula for Kapitsa $GITHUB_REF_NAME, generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (url, version and sha256 $sha). That run installed and tested this exact formula before opening this pull request.")
          fi
          # The branch the pull request holds is what gets checked here; `brew install nace-ai/tap/kapitsa` serves the
          # new version only once the pull request is approved and merged.
          git fetch --quiet origin "$branch"
          served=$(git show "FETCH_HEAD:Formula/kapitsa.rb" | sed -nE 's/^  sha256 "([0-9a-f]{64})".*/\1/p')
          if [ "$served" != "$sha" ]; then
            echo "::error::The formula on $branch has sha256 ${served:-no sha256 line}, not this release's $sha."
            exit 1
          fi
          echo "::warning title=Tap pull request needs an approval::nace-ai/homebrew-tap still serves the previous version until $pr is approved and merged."
          { echo "Formula $v is in $pr (sha256 $sha). \`brew install nace-ai/tap/kapitsa\` serves $v only after a tap reviewer approves and merges it."; } >> "$GITHUB_STEP_SUMMARY"
