# Community benchmark results (bench/community): checks the `kapitsa bench` results a pull request adds, labels it, and
# keeps bench/community/RESULTS.md up to date once results reach main.
#
# The check runs on pull_request_target so that it can label pull requests from forks. That event runs with this
# repository's token, so it never runs the pull request's code: it checks out the base branch, whose
# tools/community_check.py reads the pull request's result files as data through the API (contents at the head commit)
# and never executes anything from them. Untrusted text (file names, titles) is never put into a run: line.
name: Community benchmark results

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["bench/community/results/**"]
  push:
    branches: [main]
    paths: ["bench/community/results/**", "tools/community_table.py", "bench/community/RESULTS.md"]

permissions:
  contents: read

concurrency:
  group: community-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # pull_request_target checks out the base branch as it is now (its newest checker), never the pull request
      - name: Check out the base branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # a Python of its own: the runner's system Python refuses pip installs (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Check the results and label the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/community_check.py --github

  table:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Write RESULTS.md
        run: python3 tools/community_table.py

      # main only takes squash-merged pull requests, so the update goes through one
      - name: Open and merge a pull request if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- bench/community/RESULTS.md; then
            echo "RESULTS.md is up to date"
            # symmetric close: if a drift issue is open, this push is its cure
            stale_title="Community results table is stale on main"
            open_drift=$(gh issue list --state open --limit 100 --search "in:title \"$stale_title\"" --json number --jq '.[0].number // empty' || true)
            if [ -n "$open_drift" ]; then
              gh issue close "$open_drift" --comment "The table is current again as of ${GITHUB_SHA::12}." || true
            fi
            exit 0
          fi
          branch="community/results-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "bench/community/RESULTS.md: the community results, rewritten from bench/community/results" -- bench/community/RESULTS.md
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" --title "Community results: RESULTS.md rewritten" \
            --body "Rewritten by tools/community_table.py from bench/community/results after ${GITHUB_SHA::12}."; then
            # the repository's "Allow GitHub Actions to create and approve pull requests" is off: no branch left behind
            git push origin --delete "$branch"
            # The table is stale on main now and nothing else notices, so record it where a person will see it: an open
            # issue carrying the fix command, deduped by title (one drift issue at a time, re-used while it stays open).
            # Still a warning, not a failure: the merge already happened and a red run on the merge commit hides real
            # breakage; tools/community_table.py and a pull request landing RESULTS.md clear it.
            title="Community results table is stale on main"
            body=$(printf '%s\n' \
              "The push-to-main table job rewrote bench/community/RESULTS.md after ${GITHUB_SHA::12}, but it could not" \
              "open the pull request that lands it: GitHub Actions may not create pull requests in this organization" \
              "(Settings, Actions, General: Allow GitHub Actions to create and approve pull requests). The branch was" \
              "deleted, so main keeps the stale table." \
              "" \
              "To clear it:" \
              '```sh' \
              "python3 tools/community_table.py   # rewrites bench/community/RESULTS.md from bench/community/results" \
              "git checkout -b chore/community-results-${GITHUB_SHA::12}" \
              "git commit -m 'bench/community/RESULTS.md: the community results, rewritten from bench/community/results' -- bench/community/RESULTS.md" \
              "git push origin HEAD && gh pr create --fill" \
              '```' \
              "" \
              "A new issue is filed if the table drifts again after this one is closed.")
            # Interlock: the local regen watcher (agent-side fallback) may open a RESULTS.md pull request for the same
            # drift at the same time. Two signals for one drift is by design, not a bug: both clear on the same push,
            # and this issue closes itself on the cure push (see the up-to-date path above).
            # Every gh call is best-effort: a red run on the merge commit would hide real breakage, which is exactly
            # what this job exists to avoid (bash -e applies inside this if-body too).
            existing=$(gh issue list --state open --limit 100 --search "in:title \"$title\"" --json number --jq '.[0].number // empty' || true)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Still stale after ${GITHUB_SHA::12}." || true
            else
              gh issue create --title "$title" --body "$body" || true
            fi
            echo "::warning::The community table is stale on main; see the drift issue. GitHub Actions may not open pull requests here, so it has to be landed by hand or by the review sweep."
            exit 0
          fi
          gh pr merge "$branch" --squash --delete-branch
          # The merge above is authored by GITHUB_TOKEN, so it does not trigger this workflow: close the drift
          # issue here, the same way the up-to-date path does on a hand-landed RESULTS.md push.
          drift=$(gh issue list --state open --limit 100 --search "in:title \"Community results table is stale on main\"" --json number --jq '.[0].number // empty' || true)
          if [ -n "$drift" ]; then
            gh issue close "$drift" --comment "The table is current again as of ${GITHUB_SHA::12}." || true
          fi
