# Pull request checks that need no GPU and no model: the build, the CPU tests and the lint hooks.
#
# What this cannot check, and nothing on a GitHub-hosted runner can: the Metal kernels (they are embedded as source
# and compiled by the GPU driver at run time, so a build passes with a broken kernel), their speed, and whether the
# outputs are still the same. That evidence comes from the author's runs on a Mac, written in the PR (AGENTS.md,
# "Changing speed or numerics"), and from review. A green run here means the CPU side is intact, not that the change is right.
#
# Runs on `pull_request`: the PR's code runs here with a read-only token and no secrets. Do not switch this to
# pull_request_target (see community-bench.yml for the posture that event needs).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The same hooks as .pre-commit-config.yaml, run locally by `prek install`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install prek==0.5.2
      - run: prek run --all-files --show-diff-on-failure

  pr-size-script:
    # The check itself (.github/scripts/pr_size.py) is tested here; it runs on PRs in pr-size.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/test_pr_size.py

  bench-readme:
    # bench/README.md's table is written by bench/gen_readme.py from bench/results; a stale table fails here. The author
    # column comes from git history, hence the full checkout; the check ignores that column (a squash merge can change it).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 tests/test_gen_readme.py
      - run: python3 bench/gen_readme.py --check
      - run: python3 tools/readme_images/readme_images.py --tables --check

  agentic-metrics-script:
    # bench/harness/agentic.py against a fake server: no model, no GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/test_agentic.py

  build-and-test:
    # Changes that can affect the build or the tests only (the filter below). Not a required check, so a skipped run never blocks a docs-only PR.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tools/**'
              - 'tests/**'
              - 'cmake/**'
              - 'third_party/**'
              - 'packaging/**'
              - 'bench/harness/**'
              - 'bench/reasoning/**'
              - 'bench/community/**'
              - 'CMakeLists.txt'
              - 'install.sh'
              - '.github/workflows/ci.yml'
      - name: Xcode
        if: steps.changes.outputs.code == 'true'
        run: xcodebuild -version && cmake --version
      - name: Build
        # The CLI and the test programs that need no model folder. Not `all`: tools such as tensor_probe need a newer SDK than the runner has.
        if: steps.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)" --target kapitsa api_test bench_test update_test prefix_cache_test grammar_test structured_check fn_store_test fn_dflash_test dflash_accept_test tokenizer_test iq_layout_test vision_pixels_test tree_reduce_test remote_test
      - name: Python environment
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema
      - name: C++ tests
        if: steps.changes.outputs.code == 'true'
        run: build/api_test
      - name: prefix cache store
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/prefix_cache_test
      # One step per suite, so one failure does not hide the others.
      - name: fn_store_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/fn_store_test
      - name: fn_dflash_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/fn_dflash_test
      - name: dflash_accept_test --cpu
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/dflash_accept_test --cpu
      - name: tokenizer_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/tokenizer_test
      - name: iq_layout_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/iq_layout_test
      - name: vision_pixels_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/vision_pixels_test
      - name: remote_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/remote_test
      # tests/test_bench.py is not run here: on a hosted runner (a VM, "Apple M1 (Virtual)") `kapitsa bench` aborts on a
      # hardware field the VM does not report and the Mac name fails the result schema. Run it on a real Mac.
      - name: test_server --cli
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_server.py --cli build/kapitsa
      - name: test_sidecar
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_sidecar.py build/kapitsa
      - name: test_update
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_update.py build
      - name: test_community
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_community.py build
      - name: test_reasoning
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_reasoning.py
      - name: test_compare
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_compare.py build
      - name: test_logit_compare
        # the venv has no numpy: the standard library's path, which numpy's must match (the test compares them)
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_logit_compare.py
      - name: test_structured --cli
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_structured.py --cli build
      - name: test_nh_fp4_requant
        # numpy in a venv of its own: the shared one stays without it for test_logit_compare's standard-library path
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-np"
          "$RUNNER_TEMP/venv-np/bin/pip" install --quiet numpy
          "$RUNNER_TEMP/venv-np/bin/python" tests/test_nh_fp4_requant.py
