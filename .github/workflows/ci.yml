# Pull request checks that need no GPU and no model: the build, the CPU tests and the lint hooks.
#
# What this still cannot check: whether the Metal kernels compute the right answer, how fast they run, and whether
# their outputs are unchanged (the kernels are embedded as source and executed by the GPU driver at run time). That
# evidence comes from the author's runs on a Mac, written in the PR (AGENTS.md, "Changing speed or numerics"), and
# from review. `metal-compile` below does catch what a build alone cannot: a kernel that does not compile as source,
# which is fatal at model load on a machine whose driver tries to build it. A green run here still means the CPU side
# is intact and the kernels translate, not that the change is right.
#
# Runs on `pull_request`: the PR's code runs here with a read-only token and no secrets. Do not switch this to
# pull_request_target (see community-bench.yml for the posture that event needs).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The same hooks as .pre-commit-config.yaml, run locally by `prek install`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install prek==0.5.2
      - run: prek run --all-files --show-diff-on-failure

  pr-size-script:
    # The check itself (.github/scripts/pr_size.py) is tested here; it runs on PRs in pr-size.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/test_pr_size.py

  bench-readme:
    # bench/README.md's table is written by bench/gen_readme.py from bench/results; a stale table fails here. The author
    # column comes from git history, hence the full checkout; the check ignores that column (a squash merge can change it).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 tests/test_gen_readme.py
      - run: python3 tests/test_readme_images.py
      - run: python3 bench/gen_readme.py --check
      - run: python3 tools/readme_images/readme_images.py --tables --check

  community-table:
    # bench/community/RESULTS.md is written by tools/community_table.py from bench/community/results. A row merged
    # without the rewrite leaves main's table stale, and the push-to-main `table` job cannot open the pull request it
    # needs here, so nothing else would notice. Pure computation over the working tree: no author lookup, no GPU, no
    # secrets, no fetch-depth. Not a required check (the ruleset requires none): this is the loud pre-merge signal, and
    # the same run on main flags a table that went stale after the fact.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check the community results table
        run: |
          if python3 tools/community_table.py --check; then
            exit 0
          fi
          # show what the table is missing, then fail: the row and its rewrite have to ride in the same pull request
          python3 tools/community_table.py
          git --no-pager diff -- bench/community/RESULTS.md || true
          echo "::error title=Community results table is stale::bench/community/RESULTS.md does not match bench/community/results. Run 'python3 tools/community_table.py' and commit bench/community/RESULTS.md in this pull request."
          exit 1

  docs-links:
    # The docs' relative links and #anchors resolve. docs/benchmarks.md's old section names survive only as explicit
    # <a id="..."> anchors (#580) and nothing else notices a later heading rename deleting one. Its own job rather than a
    # step in bench-readme, so a dead link never reads as a stale bench table to whoever sees the red X.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/test_docs_links.py

  agentic-metrics-script:
    # bench/harness/agentic.py against a fake server: no model, no GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/test_agentic.py

  build-and-test:
    # Changes that can affect the build or the tests only (the filter below). Not a required check, so a skipped run never blocks a docs-only PR.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tools/**'
              - 'tests/**'
              - 'cmake/**'
              - 'third_party/**'
              - 'packaging/**'
              - 'bench/harness/**'
              - 'bench/reasoning/**'
              - 'bench/community/**'
              - 'CMakeLists.txt'
              - 'install.sh'
              - '.github/workflows/ci.yml'
      - name: Xcode
        if: steps.changes.outputs.code == 'true'
        run: xcodebuild -version && cmake --version
      - name: Build
        # The CLI and the test programs that need no model folder. Not `all`: tools such as tensor_probe need a newer SDK than the runner has.
        if: steps.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)" --target kapitsa systemone api_test bench_test update_test prefix_cache_test grammar_test structured_check fn_store_test fn_dflash_test dflash_accept_test tokenizer_test iq_layout_test vision_pixels_test tree_reduce_test remote_test cluster_test split_place_test json_file_test execution_session_test http_stream_test logit_dump
      - name: Python environment
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema
      - name: C++ tests
        if: steps.changes.outputs.code == 'true'
        run: build/api_test
      - name: prefix cache store
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/prefix_cache_test
      # One step per suite, so one failure does not hide the others.
      - name: fn_store_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/fn_store_test
      - name: fn_dflash_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/fn_dflash_test
      - name: dflash_accept_test --cpu
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/dflash_accept_test --cpu
      - name: tokenizer_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/tokenizer_test
      - name: iq_layout_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/iq_layout_test
      - name: vision_pixels_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/vision_pixels_test
      - name: remote_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/remote_test
      - name: cluster_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/cluster_test
      - name: split_place_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/split_place_test
      - name: json_file_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/json_file_test
      - name: execution_session_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/execution_session_test
      - name: http_stream_test
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: build/http_stream_test
      # tests/test_bench.py is not run here: on a hosted runner (a VM, "Apple M1 (Virtual)") `kapitsa bench` aborts on a
      # hardware field the VM does not report and the Mac name fails the result schema. Run it on a real Mac.
      - name: test_server --cli
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_server.py --cli build/kapitsa
      - name: test_sidecar
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_sidecar.py build/kapitsa
      - name: test_update
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_update.py build
      - name: test_community
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_community.py build
      - name: test_reasoning
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_reasoning.py
      - name: test_compare
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_compare.py build
      - name: test_logit_compare
        # the venv has no numpy: the standard library's path, which numpy's must match (the test compares them)
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_logit_compare.py
      - name: test_logit_dump
        # its output directory only: every case stops before the GPU lock and the model
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_logit_dump.py build
      - name: test_structured --cli
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: $RUNNER_TEMP/venv/bin/python tests/test_structured.py --cli build
      - name: test_nh_fp4_requant
        # numpy in a venv of its own: the shared one stays without it for test_logit_compare's standard-library path
        if: steps.changes.outputs.code == 'true' && !cancelled()
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-np"
          "$RUNNER_TEMP/venv-np/bin/pip" install --quiet numpy
          "$RUNNER_TEMP/venv-np/bin/python" tests/test_nh_fp4_requant.py

  metal-compile:
    # The kernels are embedded as source and built by the GPU driver when a model loads, so nothing else here
    # compiles them: a token like `threadgroup_barrier(mem_threadgroup)` (missing `mem_flags::`) passes the build
    # and kills every model at startup. The offline compiler is the one place a GitHub runner can see this class.
    # The unit of compilation is a whole library (all of src/kernels/*.metal concatenated behind common.h by
    # cmake/embed_kernels.cmake), not one file at a time - see the step below.
    # It cannot see wrong arithmetic, races or the 32 KB threadgroup budget - those still need an on-GPU run.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Offline-compile every Metal library the binary embeds
        run: |
          set -euo pipefail
          echo "::group::toolchain"
          xcodebuild -version || true
          xcrun -sdk macosx metal --version || true
          sw_vers || true
          echo "::endgroup::"
          # Compile the source the binary actually embeds, built by the same CMake script the build runs - a new
          # kernel or header must not need a second list here - and compile it the way the driver does: one
          # translation unit per library. The first runs of this job compiled src/kernels/*.metal one file at a
          # time and failed on `unknown type name 'AttnPrepParams'`: those declarations live in the neighbouring
          # files, and the driver never sees them apart.
          cat > "$RUNNER_TEMP/extract.py" <<'PY'
          import pathlib, re, sys
          src = pathlib.Path(sys.argv[1]).read_text()
          m = re.search(r'R"NIKERNEL\((.*)\)NIKERNEL"', src, re.S)
          if not m:
              sys.exit(f"no kernel literal in {sys.argv[1]}")
          pathlib.Path(sys.argv[2]).write_text(m.group(1))
          PY
          # The language-version probe is a throwaway kernel, never a kernel under test: asking "does this Xcode
          # accept -std=metalN" with qwen4.metal meant a source error reported as a missing language version.
          # The compiler's own diagnosis is kept, not discarded: "no metal3.1" and "the Metal Toolchain component
          # is missing from this Xcode" are different problems, and only stderr tells them apart.
          supports() {
            printf '#include <metal_stdlib>\nusing namespace metal;\nkernel void p(device int* o [[buffer(0)]]) { o[0] = 1; }\n' > "$RUNNER_TEMP/probe.metal"
            xcrun -sdk macosx metal -std="$1" -c "$RUNNER_TEMP/probe.metal" -o "$RUNNER_TEMP/probe.air" \
              >/dev/null 2>"$RUNNER_TEMP/probe-$1.err"
          }
          diagnose() { # std - the probe's compiler output, indented, first lines
            # sed, not head: head closing the pipe early would SIGPIPE sed and, under pipefail, fail the job
            sed -n '1,12p' "$RUNNER_TEMP/probe-$1.err" 2>/dev/null | sed 's/^/    /'
          }
          # A compile error in the generated blob names base.metal:7287 - a line that exists in no file in the
          # tree. The blob is written by cmake/embed_kernels.cmake, which puts every file behind a
          # `// ---- <name> ----` marker and copies its lines one for one, so the file line is the blob line minus
          # the marker's line. An error inside a macro is reported at the macro's use, with a note naming its
          # definition: the definition is the line to open, because the bad token is there, not at the call.
          # A mapping is printed only when the blob line and the source line it maps to are byte-identical, so a
          # section this job cannot follow prints that it could not name the file instead of naming a wrong one.
          section_line() { # blob file, blob line - "<file in src/kernels>\t<line>" if the line sits in a marked section
            # The nearest header that names a real file either justifies the line or nothing does. Two things
            # force that shape. Bodies carry comment lines in the marker's shape, so a header has to name a
            # file in src/kernels to count - and scanning past a header whose own section fails the byte check
            # would let a blank line or a brace in a later section match an earlier section at another
            # offset, naming the wrong file with a line that verifies.
            local at name
            while IFS=$'\t' read -r at name; do
              [ -f "src/kernels/$name" ] || continue
              [ "$(sed -n "$(($2 - at))p" "src/kernels/$name")" = "$(sed -n "$2p" "$1")" ] || return 0
              printf '%s\t%d' "$name" "$(($2 - at))"
              return 0
            done <<<"$(awk -v L="$2" '
              /^\/\/ ---- / { s = $0; sub(/^\/\/ ---- /, "", s); sub(/ ----$/, "", s); if (NR < L) { at[++n] = NR; nm[n] = s } }
              END { for (i = n; i >= 1; i--) printf "%d\t%s\n", at[i], nm[i] }
            ' "$1")"
            return 0
          }
          blame() { # blob file, compiler log - annotate the first error with the file a developer opens
            local blob=$1 log=$2 rel err msg at lineno note hit src line
            rel=$(basename "$blob")
            err=$(grep -m1 -E "/$rel:[0-9]+:[0-9]+: error:" "$log") || return 0
            msg=${err#*: error: }
            at=${err#*"/$rel:"}
            lineno=${at%%:*}
            at=$(awk -v pat="$err" 'index($0, pat) { print NR; exit }' "$log")
            if [ -n "$at" ]; then
              # The window starts after the error line and stops at the next diagnostic: a later error or
              # warning can carry its own `note: expanded from macro`, and taking that one would annotate a
              # real line belonging to a different finding.
              note=$(sed -n "$((at + 1)),$((at + 12))p" "$log" \
                | awk '/: (error|warning|fatal error): / { exit } /note: expanded from macro/ { print; exit }' || true)
              if [[ $note =~ (^|/)"$rel":([0-9]+):[0-9]+: ]]; then
                lineno=${BASH_REMATCH[2]}
              fi
            fi
            hit=$(section_line "$blob" "$lineno")
            src=${hit%%$'\t'*}
            line=${hit##*$'\t'}
            if [ -n "$src" ] && [ "$(sed -n "${line}p" "src/kernels/$src")" = "$(sed -n "${lineno}p" "$blob")" ]; then
              echo "::error file=src/kernels/$src,line=$line::$msg"
            else
              echo "the first error is at $rel:$lineno in the generated blob; it is not in a section that maps back to one source line, so this log does not name the file"
            fi
          }
          fail=0
          check() { # name, embed script, -std=, extra compiler flags
            local name=$1 script=$2 std=$3
            shift 3
            cmake -DOUT="$RUNNER_TEMP/$name.cpp" -DSRC_DIR="$PWD/src/kernels" -P "cmake/$script"
            python3 "$RUNNER_TEMP/extract.py" "$RUNNER_TEMP/$name.cpp" "$RUNNER_TEMP/$name.metal"
            if xcrun -sdk macosx metal -std="$std" "$@" -I src/kernels -c "$RUNNER_TEMP/$name.metal" -o "$RUNNER_TEMP/$name.air" \
                 >"$RUNNER_TEMP/$name.log" 2>&1; then
              echo "ok: $name ($std, $(wc -c < "$RUNNER_TEMP/$name.metal") bytes)"
            else
              echo "::error file=cmake/$script::the $name Metal library does not compile offline ($std)"
              blame "$RUNNER_TEMP/$name.metal" "$RUNNER_TEMP/$name.log"
              echo "::group::compiler output for the $name library ($std)"
              sed -n '1,12p' "$RUNNER_TEMP/$name.log" | sed 's/^/    /'
              echo "::endgroup::"
              fail=1
            fi
          }
          need() { # std this job must be able to compile at
            if ! supports "$1"; then
              echo "::error::this runner's Xcode has no $1, so the libraries the driver builds at it cannot be checked here"
              echo "::group::metal -std=$1 probe output"
              diagnose "$1"
              echo "::endgroup::"
              fail=1
              return 1
            fi
            echo "runner supports $1"
          }
          # The versions Gpu::compile / compile_library ask for: the base library 3.1 (and the weight-format pass
          # over the same source, NI_WF_INST), the extra libraries 3.2 (metal32, device-scope fences), the tensor
          # library 4.0 (tensor_ops on matrix units).
          need metal3.1 && check base    embed_kernels.cmake metal3.1
          need metal3.1 && check base-wf embed_kernels.cmake metal3.1 -DNI_WF_INST=1
          need metal3.2 && check nh      embed_kernels_nh.cmake    metal3.2
          need metal3.2 && check dory    embed_kernels_dory.cmake  metal3.2
          need metal3.2 && check flint   embed_kernels_flint.cmake metal3.2
          # The tensor library is Metal 4, and a macOS 15 runner has no Metal 4 compiler - the driver on such a Mac
          # does not build it either, so this is a skip on this image, not a pass. On a runner that has Metal 4 it is
          # compiled like the rest, which is how a typo there gets caught instead of shipped.
          if supports metal4.0; then
            echo "runner supports metal4.0"
            check tensor embed_kernels_tensor.cmake metal4.0
          else
            echo "skipping the Metal 4 tensor library: this runner has no metal4.0 compiler"
            echo "::group::metal -std=metal4.0 probe output"
            diagnose metal4.0
            echo "::endgroup::"
          fi
          exit "$fail"
