<!doctype html><meta charset=utf-8><style>
body{margin:0;width:880px;height:480px;background:#fff;font:14px -apple-system,Helvetica,Arial,sans-serif;color:#1f2328;position:relative;overflow:hidden}
.hdr{height:64px;border-bottom:1px solid #d1d9e0;background:#f6f8fa;display:flex;align-items:center;padding:0 24px;gap:10px}
.repo{font-size:20px;color:#0969da}.repo b{color:#1f2328}
.btns{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid #d1d9e0;border-radius:6px;padding:5px 12px;background:#f6f8fa;font-weight:600;font-size:13px}
.btn.on{outline:3px solid #fd8c73;outline-offset:1px}
.menu{position:absolute;right:130px;top:58px;width:290px;background:#fff;border:1px solid #d1d9e0;border-radius:10px;box-shadow:0 8px 24px #1f23282e;padding:6px 0}
.menu .t{padding:8px 16px;font-weight:600;border-bottom:1px solid #d1d9e0;margin-bottom:4px}
.it{padding:8px 16px 8px 36px;position:relative}.it small{display:block;color:#59636e;font-size:12px}
.it.sel:before{content:"✓";position:absolute;left:14px;color:#1f2328}
.hl{background:#ddf4ff}
.dlg{position:absolute;left:110px;top:84px;width:460px;background:#fff;border:1px solid #d1d9e0;border-radius:12px;box-shadow:0 8px 32px #1f232840;padding:18px 20px}
.dlg h3{margin:0 0 4px;font-size:16px}.dlg p{margin:0 0 14px;color:#59636e;font-size:13px}
.row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:6px}
.cb{width:16px;height:16px;border:1px solid #818b98;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.cb.on{background:#0969da;border-color:#0969da}
.apply{margin-top:12px;background:#1f883d;color:#fff;border-radius:6px;padding:6px 14px;display:inline-block;font-weight:600}
.cap{position:absolute;left:0;right:0;bottom:0;height:46px;background:#1f2328;color:#fff;display:flex;align-items:center;padding:0 24px;font-size:16px}
.cap b{background:#fd8c73;color:#1f2328;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;margin-right:12px;font-size:14px}
.ok{position:absolute;left:24px;top:84px;font-size:13px;color:#59636e}
.bell{position:absolute;right:24px;top:140px;font-size:13px;color:#1a7f37;font-weight:600}
</style>
<body><div class=hdr><span class=repo>nace-ai / <b>kapitsa</b></span><div class=btns><span class="btn" id=w>👁 Watch ▾ <span style="font-weight:400;color:#59636e">Participating</span></span><span class=btn>⑂ Fork</span><span class=btn>☆ Star</span></div></div>
<div id=body></div>
<script>
const s=+location.search.slice(1);
const cap=['Open github.com/nace-ai/kapitsa and click Watch','Choose Custom','Tick Releases','Apply: GitHub notifies you of every new Kapitsa release'][s];
let h='';
if(s>=0)document.getElementById('w').className='btn'+(s==0?' on':'');
if(s==0||s==1)h+=`<div class=menu><div class=t>Notifications</div><div class=it sel>Participating and @mentions<small>Only receive notifications from this repository when participating or @mentioned.</small></div><div class=it>All Activity<small>Notified of all notifications on this repository.</small></div><div class=it>Ignore</div><div class="it ${s==1?'hl':''}">Custom<small>Select events you want to be notified of in addition to participating and @mentions.</small></div></div>`;
if(s>=2)h+=`<div class=dlg><h3>Select events</h3><p>Select the events you want to be notified of in addition to participating and @mentions.</p><div class=row><span class=cb>&nbsp;</span>Issues</div><div class=row><span class=cb>&nbsp;</span>Pull requests</div><div class="row ${s==2?'hl':''}"><span class="cb ${s>=2?'on':''}">✓</span><b>Releases</b></div><div class=row><span class=cb>&nbsp;</span>Discussions</div><div class=row><span class=cb>&nbsp;</span>Security alerts</div><span class=apply>Apply</span></div>`;
if(s==3)h+=`<div class=bell>✓ Watching: Releases</div>`;
document.getElementById('body').innerHTML=h;
const c=document.createElement('div');c.className='cap';c.innerHTML=`<b>${s+1}</b>${cap}`;document.body.appendChild(c);
if(s==3){document.getElementById('w').innerHTML='👁 Watch ▾ <span style="font-weight:400;color:#1a7f37">Custom</span>'}
</script></body>
